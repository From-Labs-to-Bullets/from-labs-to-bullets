<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Labs to Bullets</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='1' y='1' width='46' height='46' rx='12' fill='%230b1f55'/%3E%3Cpath d='M14 32h20a6.5 6.5 0 0 0 .6-13A9 9 0 0 0 17.3 17.6 7.2 7.2 0 0 0 14 32z' fill='none' stroke='%232cc4c0' stroke-width='2.6' stroke-linejoin='round'/%3E%3Cpath d='M19 22.5l3.5 3-3.5 3' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M25 28.5h5' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f5fb; --surface:#ffffff; --surface-2:#eef2fa; --text:#101a3a; --muted:#59627c;
  --border:#d9e0ee; --primary:#1d3f8f; --primary-hover:#173374; --on-primary:#fff;
  --teal:#0e8f8f; --teal-soft:#e0f4f3; --purple:#6b5cc9; --purple-soft:#eeebfb;
  --warn:#a34a0c; --warn-soft:#fdf0e3; --ok:#0d7a5f; --ok-soft:#e1f5ee; --danger:#b42318;
  --shadow:0 1px 2px rgba(16,26,58,.06),0 4px 14px rgba(16,26,58,.05);
  --radius:14px;
  --header-grad:linear-gradient(120deg,#0b2263 0%,#16518a 52%,#5341a8 100%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1024; --surface:#111a34; --surface-2:#172347; --text:#e5eaf7; --muted:#9ba6c3;
    --border:#25325a; --primary:#5b8cff; --primary-hover:#7aa2ff; --on-primary:#06102b;
    --teal:#35c6c1; --teal-soft:#0f2f3a; --purple:#a99df5; --purple-soft:#241f4a;
    --warn:#f2a65a; --warn-soft:#33220f; --ok:#4fd1a5; --ok-soft:#0e2e27; --danger:#ff8a80;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0a1024; --surface:#111a34; --surface-2:#172347; --text:#e5eaf7; --muted:#9ba6c3;
  --border:#25325a; --primary:#5b8cff; --primary-hover:#7aa2ff; --on-primary:#06102b;
  --teal:#35c6c1; --teal-soft:#0f2f3a; --purple:#a99df5; --purple-soft:#241f4a;
  --warn:#f2a65a; --warn-soft:#33220f; --ok:#4fd1a5; --ok-soft:#0e2e27; --danger:#ff8a80;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
h1,h2,h3{line-height:1.25;margin:0}
h2{font-size:1.2rem}
h3{font-size:1.02rem}
a{color:var(--primary)}
button{font:inherit;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Header */
.app-header{background:var(--header-grad);color:#fff;padding-top:14px}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:1.25rem;letter-spacing:.2px}
.brand p{margin:0;font-size:.85rem;opacity:.82}
.week-badge{font-size:.82rem;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:4px 10px;border-radius:999px;white-space:nowrap}
.week-badge:empty{display:none}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:rgba(255,255,255,.78);padding:10px 14px;border-radius:10px 10px 0 0;white-space:nowrap;font-weight:600;font-size:.92rem}
.tabs button:hover{color:#fff;background:rgba(255,255,255,.08)}
.tabs button[aria-current="page"]{background:var(--bg);color:var(--text)}

main{padding-top:20px;padding-bottom:60px}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.lede{margin:.3rem 0 0;color:var(--muted)}

/* Fields */
.field{display:block;margin:0 0 16px}
.field:last-child{margin-bottom:0}
.q{display:block;font-weight:600;margin-bottom:6px}
.q b{color:var(--teal);margin-right:2px}
.q .opt{font-weight:400;color:var(--muted);font-size:.85rem}
.req{color:var(--danger);font-style:normal}
.hint{display:block;font-size:.84rem;color:var(--muted);margin:-2px 0 6px}
input[type=text],input[type=date],input[type=number],input:not([type]),select,textarea{
  width:100%;font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:9px 11px;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 25%,transparent)}
.invalid{border-color:var(--danger)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 18%,transparent)!important}
input.short{max-width:120px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 15px;border-radius:10px;font-weight:600;font-size:.92rem}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.small{padding:6px 11px;font-size:.84rem}
.btn.danger{color:var(--danger)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text)}
[hidden]{display:none !important}
.actions-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:1.3rem;line-height:1}
.icon-btn:hover{border-color:var(--teal)}

/* Day bar */
.daybar{display:flex;align-items:center;gap:12px;padding:12px}
.daybar-mid{flex:1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.daybar-mid input{max-width:180px}
.daylabel{font-weight:600}
.daylabel span{display:block;font-weight:400;color:var(--muted);font-size:.86rem}

/* Pills */
.pill{display:inline-block;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.draft{background:var(--warn-soft);color:var(--warn)}
.pill.purple{background:var(--purple-soft);color:var(--purple)}

/* Lab card */
.lab{border-left:4px solid var(--teal)}
.lab-num{color:var(--teal)}
.notes-card{border-left:4px solid var(--purple)}
details.examples{margin-top:8px;font-size:.88rem}
details.examples summary{cursor:pointer;color:var(--teal);font-weight:600;width:max-content}
details.examples ul{margin:8px 0 0;padding:10px 12px 10px 28px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--muted)}
details.examples li{margin:3px 0}
details.examples li b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:5px 12px;border-radius:999px;font-size:.85rem;font-weight:600}
.chip:hover{border-color:var(--purple);color:var(--text)}
.chip.on{background:var(--purple-soft);border-color:var(--purple);color:var(--purple)}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:6px;margin-top:8px}
.tagbox input{flex:1;min-width:min(180px,100%);border:0!important;background:transparent!important;box-shadow:none!important;padding:4px 6px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--teal-soft);color:var(--teal);font-size:.84rem;font-weight:600;padding:3px 4px 3px 10px;border-radius:999px}
.tag button{border:0;background:none;color:inherit;font-size:1rem;line-height:1;padding:0 5px;border-radius:999px}
.tag button:hover{background:color-mix(in srgb,var(--teal) 20%,transparent)}
.tag.static{padding-right:10px}

/* Notice */
.notice{border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.notice.info{background:var(--purple-soft);border-color:color-mix(in srgb,var(--purple) 35%,transparent)}
.notice.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.notice ul{margin:6px 0 0;padding-left:20px}

/* Segmented */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:8px;font-weight:600;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.daytabs{display:flex;width:100%}
.daytabs button{flex:1;padding:10px 14px;font-size:.98rem}
.daytabs button[aria-pressed="true"]{background:var(--primary);color:#fff}
.linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;text-align:left}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.controls .field{margin:0;flex:1;min-width:min(200px,100%)}

/* Prompt cards */
.prompt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px;align-items:start}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.pcard-top{display:flex;align-items:center;gap:10px}
.pcard-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.pcard p{margin:0;color:var(--muted);font-size:.9rem}
.pcard .actions-row{margin-top:auto;padding-top:6px}
pre.prompt{white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;font:13px/1.5 Consolas,"Cascadia Mono",ui-monospace,monospace;max-height:340px;overflow:auto;margin:6px 0 0}
.c-teal{background:var(--teal-soft);color:var(--teal)}
.c-purple{background:var(--purple-soft);color:var(--purple)}
.c-blue{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.c-warn{background:var(--warn-soft);color:var(--warn)}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.tile .num{font-size:1.6rem;font-weight:700;line-height:1.1}
.tile .lbl{color:var(--muted);font-size:.84rem}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px}
.progress > div{height:100%;background:linear-gradient(90deg,var(--teal),var(--purple));border-radius:99px}

/* Timeline */
details.week{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
details.week > summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
details.week > summary::-webkit-details-marker{display:none}
details.week.current{border-color:var(--teal)}
details.week.future{opacity:.62}
.week-title{font-weight:700}
.week-title span{font-weight:400;color:var(--muted);font-size:.86rem;margin-left:6px}
.dayrows{border-top:1px solid var(--border)}
.week-prodev{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px;border:1px dashed var(--purple);border-radius:var(--radius);background:var(--purple-soft)}
.week-prodev.current{border-style:solid}
.prodev{border-top:4px solid var(--purple)}
.dayrow{display:grid;grid-template-columns:110px 1fr auto auto;gap:10px;align-items:center;padding:10px 16px;border:0;border-bottom:1px solid var(--border);background:none;width:100%;text-align:left;color:var(--text)}
.dayrow:last-child{border-bottom:0}
.dayrow:hover{background:var(--surface-2)}
.dayrow .c{color:var(--muted);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.dayrow{grid-template-columns:1fr auto}.dayrow .c,.dayrow .labs{display:none}}

/* Bullets */
.bullet-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.bullet-list li{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.bullet-list li .t{flex:1}
.bullet-list li .t::before{content:"•";color:var(--teal);font-weight:700;margin-right:8px}

.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.radio-row label{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:10px;padding:6px 12px;cursor:pointer;background:var(--surface-2)}
.radio-row input{accent-color:var(--teal)}
.empty{text-align:center;padding:36px 18px}
.empty h2{margin-bottom:6px}
.welcome{max-width:620px;margin:10px auto}
.welcome ul{padding-left:20px;color:var(--muted)}
.charcount{font-size:.82rem;color:var(--muted)}
.charcount.warn{color:var(--warn);font-weight:600}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:0 16px 30px}
</style>
</head>
<body>
<header class="app-header">
  <div class="wrap header-inner">
    <div class="brand">
      <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35c6c1"/><stop offset="1" stop-color="#a99df5"/></linearGradient></defs>
        <rect x="1" y="1" width="46" height="46" rx="12" fill="#0a1a4a" stroke="url(#lg)" stroke-width="1.6"/>
        <path d="M14 30h20a6.5 6.5 0 0 0 .6-13A9 9 0 0 0 17.3 15.6 7.2 7.2 0 0 0 14 30z" fill="none" stroke="url(#lg)" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M19 20.5l3.5 3-3.5 3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M25 26.5h5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="15.5" cy="37" r="1.7" fill="#35c6c1"/>
        <path d="M20 37h14" stroke="#a99df5" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <div><h1>From Labs to Bullets</h1><p>Track. Learn. Get hired.</p></div>
    </div>
    <div id="weekBadge" class="week-badge"></div>
  </div>
  <nav class="wrap tabs" id="tabs" aria-label="Main">
    <button data-view="today">Today</button>
    <button data-view="study">Study prompts</button>
    <button data-view="timeline">Timeline</button>
    <button data-view="summaries">Summaries &amp; bullets</button>
    <button data-view="settings">Settings &amp; backup</button>
  </nav>
</header>
<main class="wrap" id="main"></main>
<footer id="footNote">Your entries are stored only in this browser on this laptop. Use <b>Settings &amp; backup</b> to save a copy.</footer>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="techlist"></datalist>

<script>
(function(){
'use strict';

/* ---------- Constants ---------- */
const KEY = 'fltb.v1';
const TOTAL_WEEKS = 17;
const PRO_DEV_WEEK = 9;   // Professional Development week: not tracked in the app
const DEFAULT_COURSES = [
  'AZ-040: Automating Administration with PowerShell',
  'GH-900: GitHub Foundations',
  'Windows Server: Installation, Storage and Compute',
  'Windows Server: Networking',
  'Windows Server: Identity',
  'Linux Administration Fundamentals (Ubuntu)',
  'AZ-900: Azure Fundamentals',
  'AI-901: Microsoft Azure AI Fundamentals',
  'AZ-400: DevOps Solutions',
  'MD-102: Endpoint Administrator',
  'AZ-104: Azure Administrator',
  'SC-300: Identity and Access Administrator'
];
const SEED_TECH = ['PowerShell','Azure CLI','Azure Portal','Azure Cloud Shell','Azure Virtual Machines','Azure Virtual Network','Network Security Groups','Azure Load Balancer','Azure DNS','Azure Storage','Azure Blob Storage','Azure Files','Azure Backup','Azure App Service','Azure Monitor','Log Analytics','Azure Policy','Azure RBAC','Azure Resource Manager','ARM templates','Bicep','Azure Key Vault','Microsoft Entra ID','Conditional Access','Multifactor authentication','Privileged Identity Management','Microsoft Intune','Windows Autopilot','Microsoft 365 admin center','Windows Server','Windows Admin Center','Server Manager','Active Directory Domain Services','Group Policy','DNS','DHCP','Hyper-V','Storage Spaces','Failover Clustering','iSCSI','Ubuntu','Bash','SSH','systemd','apt','Git','GitHub','GitHub Actions','Azure DevOps','Azure Pipelines','Azure Repos','Docker','Azure Container Instances','Azure Kubernetes Service','Azure AI services','Azure OpenAI','Microsoft Copilot'];
const LEVELS = {
  new:     { label:'New to IT', text:"I'm new to IT, so start at an entry level and build up." },
  some:    { label:'Some IT exposure (classes, certifications, home lab, or self-study)', text:"I've had some exposure to IT through classes, certifications, or self-study, but much of this material is new to me." },
  working: { label:'Previous IT work experience (military or civilian)', text:'I have previous IT work experience, so you can move quickly past the basics. Some of these tools and technologies may still be new to me.' }
};
const levelOptions = sel => Object.entries(LEVELS).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${esc(v.label)}</option>`).join('');
const ACTIONS = ['Built','Configured','Deployed','Automated','Secured','Troubleshot','Installed','Managed','Monitored','Migrated'];

/* ---------- Date helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const todayISO = () => iso(new Date());
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return iso(d); };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const dow = s => parse(s).getDay();
const fmt = (s,o) => parse(s).toLocaleDateString(undefined,o);
const fmtShort = s => fmt(s,{weekday:'short',month:'short',day:'numeric'});
const fmtLong = s => fmt(s,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
const fmtMD = s => fmt(s,{month:'short',day:'numeric'});
function weekOf(s){
  if(!S.settings.startDate) return null;
  return Math.floor(daysBetween(mondayOf(S.settings.startDate), s)/7) + 1;
}
const weekStart = w => addDays(mondayOf(S.settings.startDate), (w-1)*7);
const isProDev = s => weekOf(s) === PRO_DEV_WEEK;
const isValidISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s||'');

/* ---------- Utilities ---------- */
const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = s => String(s ?? '').trim();
const labsText = n => n === 1 ? '1 lab' : `${n} labs`;
const linesOf = s => String(s||'').split(/\r?\n/).map(x=>x.replace(/^[-*•\s]+/,'').trim()).filter(Boolean);
function linkify(text){
  return esc(text).replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
}
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast('Copied! Paste it into your AI tool.'); return; } catch(e){}
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Copied! Paste it into your AI tool.'); } catch(e){ toast('Copy failed. Select the text and press Ctrl+C.'); }
  ta.remove();
}

/* ---------- Data ---------- */
function fresh(){
  return { version:1, settings:{ startDate:'', level:'new', courses:DEFAULT_COURSES.slice(), lastCourse:'', lastBackup:null }, days:{}, weeks:{}, bullets:[] };
}
function normLab(l){
  l = l || {};
  return { title:clean(l.title)?l.title:'', actions:Array.isArray(l.actions)?l.actions:[], did:l.did||'', techs:Array.isArray(l.techs)?l.techs:[], outcome:l.outcome||'', scope:l.scope||'' };
}
function normDay(d, date){
  d = d || {};
  return { date: d.date || date, type: d.type==='interview' ? 'interview' : 'class', reflection:d.reflection||'', reviewPlan:d.reviewPlan||'',
    course:d.course||'', topics:d.topics||'', labCount:(d.labCount===''||d.labCount==null)?'':Number(d.labCount)||0,
    labs:Array.isArray(d.labs)?d.labs.map(normLab):[], notes:d.notes||'', resources:d.resources||'', interesting:d.interesting||'', updated:d.updated||null };
}
function normalize(raw){
  const base = fresh();
  if(!raw || typeof raw !== 'object') return base;
  base.settings = Object.assign(base.settings, raw.settings||{});
  if(!Array.isArray(base.settings.courses) || !base.settings.courses.length) base.settings.courses = DEFAULT_COURSES.slice();
  for(const [k,v] of Object.entries(raw.days||{})) if(isValidISO(k)) base.days[k] = normDay(v,k);
  base.weeks = (raw.weeks && typeof raw.weeks==='object') ? raw.weeks : {};
  base.bullets = Array.isArray(raw.bullets) ? raw.bullets.filter(b=>b && b.text) : [];
  return base;
}
let storageOK = true;
function load(){
  try { const raw = localStorage.getItem(KEY); if(raw) return normalize(JSON.parse(raw)); }
  catch(e){ storageOK = false; }
  return fresh();
}
let S = load();
let saveTimer = null;
function saveNow(){
  clearTimeout(saveTimer); saveTimer = null;
  S.settings.savedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ if(storageOK) toast('Could not save in this browser. Download a backup in Settings.'); storageOK = false; }
  queueFileWrite();
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 350); }
window.addEventListener('beforeunload', ()=>{ if(saveTimer) saveNow(); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ if(saveTimer) saveNow(); if(fileTimer){ clearTimeout(fileTimer); fileTimer = null; writeFile(); } } });
// If the app is open in two tabs, keep them in step: when one tab saves, the other reloads the diary,
// so an older tab can never overwrite newer entries.
window.addEventListener('storage', e => {
  if(e.key !== KEY || !e.newValue) return;
  try { clearTimeout(saveTimer); saveTimer = null; S = normalize(JSON.parse(e.newValue)); st.entry = null; render(); } catch(err){}
});

/* ---------- Auto-save to a file (Edge and Chrome on a computer) ----------
   The browser copy stays the working copy. When auto-save is on, every save is
   mirrored to a file the student picked (ideally in OneDrive). On startup the two
   are compared and the newer one wins, so clearing the browser loses nothing. */
const FS_OK = typeof window.showSaveFilePicker === 'function' && window.isSecureContext;
const AS = { handle:null, state:'off', lastWrite:null, writing:false, pending:false, problem:'' };
// state: 'off' | 'on' | 'paused' (browser needs a click to allow editing) | 'problem' (file missing or unreadable)
const FILE_TYPES = [{ description:'Training diary', accept:{'application/json':['.json']} }];
function idb(mode, fn){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('fltb-files', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onerror = () => reject(req.error);
    req.onsuccess = () => {
      const db = req.result, tx = db.transaction('handles', mode), r = fn(tx.objectStore('handles'));
      tx.oncomplete = () => { db.close(); resolve(r && r.result); };
      tx.onerror = () => { db.close(); reject(tx.error); };
    };
  });
}
const idbGet = k => idb('readonly', s => s.get(k));
const idbSet = (k,v) => idb('readwrite', s => s.put(v,k));
const idbDel = k => idb('readwrite', s => s.delete(k));

let fileTimer = null;
function queueFileWrite(){ if(AS.state !== 'on') return; clearTimeout(fileTimer); fileTimer = setTimeout(()=>{ fileTimer = null; writeFile(); }, 500); }
async function writeFile(){
  if(AS.state !== 'on' || !AS.handle) return;
  if(AS.writing){ AS.pending = true; return; }
  AS.writing = true;
  try {
    const w = await AS.handle.createWritable();
    await w.write(JSON.stringify(S, null, 2));
    await w.close();
    AS.lastWrite = Date.now();
  } catch(e){
    if(e && e.name === 'NotAllowedError'){ AS.state = 'paused'; toast('Auto-save is paused. Click "Resume auto-save" to keep saving to your file.'); }
    else if(e && e.name === 'NotFoundError'){ AS.state = 'problem'; AS.problem = 'missing'; toast("Auto-save can't find your diary file."); }
    else { AS.state = 'problem'; AS.problem = 'write'; toast("Auto-save couldn't write to your diary file."); }
    refreshFileUI(true);
  } finally {
    AS.writing = false;
    if(AS.pending){ AS.pending = false; writeFile(); }
  }
  refreshFileUI(false);
}
// Compares the file with the browser copy. Loads the file if it is newer (or the browser is empty), otherwise writes to it.
async function syncWithFile(){
  let data = null;
  try {
    const text = await (await AS.handle.getFile()).text();
    if(text.trim()) data = JSON.parse(text);
  } catch(e){
    AS.state = 'problem'; AS.problem = (e && e.name === 'NotFoundError') ? 'missing' : 'invalid';
    return false;
  }
  if(data && !(data.settings && data.days)){ AS.state = 'problem'; AS.problem = 'invalid'; return false; }
  AS.state = 'on'; AS.problem = '';
  const fileAt = (data && data.settings.savedAt) || 0, localAt = S.settings.savedAt || 0;
  const fileHasDays = data && Object.keys(data.days).length > 0;
  if(data && (fileAt > localAt || (!loggedDays().length && fileHasDays))){
    S = normalize(data);
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
    AS.lastWrite = fileAt || null;
    toast(`Diary loaded from ${AS.handle.name}`);
  } else {
    await writeFile();
  }
  return true;
}
async function turnOnAutoSave(){
  let h;
  try { h = await window.showSaveFilePicker({ suggestedName:'My training diary.json', types:FILE_TYPES, startIn:'documents', id:'fltb-diary' }); }
  catch(e){ if(e && e.name !== 'AbortError') toast("Couldn't turn on auto-save. Please try again."); return false; }
  AS.handle = h;
  try { await idbSet('diary', h); } catch(e){}
  saveNow();
  const ok = await syncWithFile();
  if(ok) toast(`Auto-save is on. Saving to ${h.name}`);
  return ok;
}
async function openDiaryFile(){
  let h;
  try { [h] = await window.showOpenFilePicker({ types:FILE_TYPES, multiple:false, id:'fltb-diary' }); }
  catch(e){ if(e && e.name !== 'AbortError') toast("Couldn't open that file."); return false; }
  let data;
  try { data = JSON.parse(await (await h.getFile()).text()); } catch(e){ toast("That file isn't a From Labs to Bullets diary."); return false; }
  if(!data || !data.settings || !data.days){ toast("That file isn't a From Labs to Bullets diary."); return false; }
  if(loggedDays().length && !confirm(`Replace the diary in this browser with ${h.name} (${Object.keys(data.days).length} days)?`)) return false;
  S = normalize(data);
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  AS.handle = h;
  try { await idbSet('diary', h); } catch(e){}
  let perm = 'prompt';
  try { perm = await h.requestPermission({ mode:'readwrite' }); } catch(e){}
  AS.state = perm === 'granted' ? 'on' : 'paused';
  AS.lastWrite = data.settings.savedAt || null;
  toast(`Diary loaded from ${h.name}`);
  return true;
}
async function resumeAutoSave(){
  if(!AS.handle) return;
  let perm = 'denied';
  try { perm = await AS.handle.requestPermission({ mode:'readwrite' }); } catch(e){}
  if(perm !== 'granted'){ toast('Edge needs your permission to keep saving to the file.'); return; }
  await syncWithFile();
  render();
}
async function turnOffAutoSave(quiet){
  clearTimeout(fileTimer); fileTimer = null;
  const name = AS.handle && AS.handle.name;
  Object.assign(AS, { handle:null, state:'off', lastWrite:null, problem:'' });
  try { await idbDel('diary'); } catch(e){}
  if(!quiet) toast(`Auto-save is off. ${name ? name + ' was not deleted.' : ''}`);
}
async function initAutoSave(){
  try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if(!FS_OK) return;
  let h = null;
  try { h = await idbGet('diary'); } catch(e){ return; }
  if(!h) return;
  AS.handle = h;
  let perm = 'prompt';
  try { perm = await h.queryPermission({ mode:'readwrite' }); } catch(e){}
  if(perm === 'granted') await syncWithFile(); else AS.state = 'paused';
  render();
}
function fmtTime(ms){ return new Date(ms).toLocaleString(undefined, { weekday:'short', hour:'numeric', minute:'2-digit' }); }
function fileStatusHTML(){
  const name = AS.handle ? `<b>${esc(AS.handle.name)}</b>` : 'your diary file';
  if(AS.state === 'on') return `<span class="pill ok">On</span> Saving to ${name}${AS.lastWrite ? ` · last saved ${esc(fmtTime(AS.lastWrite))}` : ''}`;
  if(AS.state === 'paused') return `<span class="pill draft">Paused</span> Edge needs one click to keep saving to ${name}.`;
  if(AS.state === 'problem') return `<span class="pill draft">Needs attention</span> ${AS.problem === 'missing' ? `Can't find ${name}. It may have been moved, renamed, or deleted.` : AS.problem === 'invalid' ? `${name} doesn't look like a diary file.` : `Couldn't save to ${name}.`}`;
  return '<span class="pill">Off</span> Your diary is saved only in this browser.';
}
// Small updates without a full re-render (so typing is never interrupted).
function refreshFileUI(stateChanged){
  const el = $('#fileStatus'); if(el) el.innerHTML = fileStatusHTML();
  const f = $('#footNote');
  if(f && FS_OK) f.innerHTML =
    AS.state === 'on' ? `Auto-save is on: your diary is also saved to <b>${esc(AS.handle.name)}</b>.` :
    AS.state === 'paused' ? `Auto-save is paused. Click <b>Resume auto-save</b> to keep saving to <b>${esc(AS.handle.name)}</b>.` :
    AS.state === 'problem' ? 'Auto-save needs attention. Open <b>Settings &amp; backup</b> to fix it.' :
    'Your entries are stored in this browser. Turn on auto-save in <b>Settings &amp; backup</b> so you never lose them.';
  if(stateChanged && (st.view === 'settings' || st.view === 'today') && !main.contains(document.activeElement)) render();
}
// Banner shown at the top of Today when auto-save needs attention, or as a weekly reminder.
function fileBannerHTML(){
  if(!FS_OK) return backupNudge();
  if(AS.state === 'paused') return `<div class="notice info small actions-row" style="justify-content:space-between"><span><b>Auto-save is paused.</b> Click the button, then <b>Allow</b>, to keep saving your diary to ${esc(AS.handle.name)}. If Edge offers <b>Allow on every visit</b>, choose it so Edge stops asking.</span><button class="btn primary small" data-fs="resume">Resume auto-save</button></div>`;
  if(AS.state === 'problem') return `<div class="notice small actions-row" style="justify-content:space-between"><span><b>Auto-save needs attention.</b> ${AS.problem === 'missing' ? "We can't find your diary file. It may have been moved or renamed." : "We couldn't use your diary file."}</span><span class="actions-row"><button class="btn small" data-fs="open">Find my file</button><button class="btn small" data-fs="on">Save to a new file</button></span></div>`;
  if(AS.state === 'on') return '';
  if(st.skippedAutoSave) return `<div class="notice info small actions-row" style="justify-content:space-between"><span>No problem. You can turn on auto-save any time in <b>Settings &amp; backup</b>. Until then, download a backup every Friday so you don't lose your work.</span><button class="btn ghost small" data-fs="hideskip" aria-label="Dismiss">Got it</button></div>`;
  const w = weekOf(todayISO()), snoozed = S.settings.autoSaveSnooze && (Date.now() - S.settings.autoSaveSnooze) < 7*864e5;
  if(w >= 2 && loggedDays().length && !snoozed) return `<div class="notice info small actions-row" style="justify-content:space-between"><span><b>Turn on auto-save so you never lose your entries.</b> It saves your diary to a file on your computer every time you type.</span><span class="actions-row"><button class="btn primary small" data-fs="on">Turn on auto-save</button><button class="btn ghost small" data-fs="snooze">Not now</button></span></div>`;
  return backupNudge();
}
// Shared click handling for auto-save buttons (data-fs="…") anywhere in the page.
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-fs]'); if(!b) return;
  const a = b.dataset.fs;
  if(a === 'on'){ if(await turnOnAutoSave()) render(); }
  if(a === 'open'){ if(await openDiaryFile()){ st.cur = todayISO(); setView(S.settings.startDate ? 'today' : st.view); } }
  if(a === 'resume') await resumeAutoSave();
  if(a === 'off'){ await turnOffAutoSave(); render(); }
  if(a === 'snooze'){ S.settings.autoSaveSnooze = Date.now(); saveNow(); render(); }
  if(a === 'hideskip'){ st.skippedAutoSave = false; render(); }
  if(a === 'hidelivetip'){ S.settings.hideLiveTip = true; saveNow(); render(); }
});

const isInterview = d => !!d && d.type === 'interview';
const labsOf = d => isInterview(d) ? [] : d.labs.slice(0, Number(d.labCount)||0).map(normLab);
const hasContent = d => d && (clean(d.topics) || labsOf(d).some(l=>clean(l.title)||clean(l.did)) || clean(d.notes) || clean(d.resources) || clean(d.interesting) || clean(d.reflection));
const dayLabelText = d => isInterview(d) ? 'Mock technical interview' : (d.course || linesOf(d.topics)[0] || '');
const loggedDays = () => Object.values(S.days).filter(hasContent).sort((a,b)=>a.date.localeCompare(b.date));
function missingFields(d){
  const m = [];
  if(isInterview(d)){
    if(!clean(d.topics)) m.push({label:'1. Topics or questions you were asked', sel:'[data-f="topics"]'});
    if(!clean(d.reflection)) m.push({label:'2. Which answers felt strong or weak', sel:'[data-f="reflection"]'});
    return m;
  }
  if(!clean(d.topics)) m.push({label:"1. Today's modules or topics", sel:'[data-f="topics"]'});
  if(d.labCount==='' || d.labCount==null) m.push({label:'2. Number of labs completed', sel:'[data-f="labCount"]', tab:'labs'});
  if(d.labCount===0 && !clean(d.notes)) m.push({label:'Notes on what you learned (needed on days without labs)', sel:'[data-f="notes"]', tab:'notes'});
  labsOf(d).forEach((l,i)=>{
    const n = `Lab ${i+1}`;
    if(!clean(l.title)) m.push({label:`${n}: lab title`, sel:`[data-lab="${i}"][data-f="title"]`, tab:'labs'});
    if(!clean(l.did)) m.push({label:`${n}: 3. what you did`, sel:`[data-lab="${i}"][data-f="did"]`, tab:'labs'});
    if(!l.techs.length) m.push({label:`${n}: 3. technologies or tools`, sel:`[data-tagbox="${i}"]`, tab:'labs'});
    if(!clean(l.outcome)) m.push({label:`${n}: 4. result and objective`, sel:`[data-lab="${i}"][data-f="outcome"]`, tab:'labs'});
    if(!clean(l.scope)) m.push({label:`${n}: 5. scope of the environment`, sel:`[data-lab="${i}"][data-f="scope"]`, tab:'labs'});
  });
  return m;
}
const isComplete = d => missingFields(d).length === 0;
function allTechs(){
  const map = new Map();
  SEED_TECH.forEach(t=>map.set(t.toLowerCase(), t));
  Object.values(S.days).forEach(d=>labsOf(d).forEach(l=>l.techs.forEach(t=>map.set(t.toLowerCase(), t))));
  return [...map.values()].sort((a,b)=>a.localeCompare(b));
}
function refreshTechList(){ $('#techlist').innerHTML = allTechs().map(t=>`<option value="${esc(t)}"></option>`).join(''); }

function backupNudge(){

function persistEntry(){

function renderTagbox(i, focus){
  const box = main.querySelector(`[data-tagbox="${i}"]`); if(!box) return;
  box.innerHTML = tagsHTML(st.entry.labs[i].techs, i);
  box.classList.remove('invalid');

}
function addTags(i, raw, focus){
  const l = st.entry.labs[i];
  const parts = String(raw).split(',').map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return;
  parts.forEach(p => { if(!l.techs.some(t=>t.toLowerCase()===p.toLowerCase())) l.techs.push(p); });
  renderTagbox(i, focus); persistEntry();
}
function onTagBlur(e){
  const t = e.target;
  if(t.dataset && t.dataset.taginput != null && clean(t.value)){
    const i = Number(t.dataset.taginput), v = t.value;
    setTimeout(()=>addTags(i, v, false), 0);
  }
}
function bindDaily(){
  const e = st.entry;
  main.oninput = ev => {
    const t = ev.target, f = t.dataset.f;
    if(t.dataset.taginput != null){
      // datalist pick: add when the value exactly matches a suggestion
      if(ev.inputType === 'insertReplacementText' || ev.inputType === undefined){
        if(allTechs().some(x=>x===t.value)) addTags(Number(t.dataset.taginput), t.value, true);
      }
      return;
    }
    if(!f) return;
    if(f === 'course' && t.value === '__add__'){
      $('#addCourse').hidden = false; $('#newCourse').value = ''; $('#newCourse').focus();
      return;
    }
    if(f === 'course') $('#addCourse').hidden = true;
    t.classList.remove('invalid');
    if(t.dataset.lab != null){ e.labs[Number(t.dataset.lab)][f] = t.value; }
    else if(f === 'labCount'){
      e.labCount = t.value==='' ? '' : Math.max(0, Math.min(12, parseInt(t.value,10)||0));
      $('#labs').innerHTML = labsHTML(e);
      $('#notesBox').innerHTML = notesHTML(e);
      const n = Number(e.labCount)||0; $('#labTabCount').textContent = n ? ` (${n})` : '';
    } else {
      e[f] = t.value;
      if(f === 'course'){ S.settings.lastCourse = t.value; }
    }
    persistEntry();
  };
  main.onkeydown = ev => {
    const t = ev.target;
    if(t.id === 'newCourse'){
      if(ev.key === 'Enter'){ ev.preventDefault(); saveNewCourse(); }
      else if(ev.key === 'Escape'){ ev.preventDefault(); cancelNewCourse(); }
      return;
    }
    if(t.dataset.taginput == null) return;
    const i = Number(t.dataset.taginput);
    if(ev.key === 'Enter' || ev.key === ','){ ev.preventDefault(); if(clean(t.value)) addTags(i, t.value, true); }
    else if(ev.key === 'Backspace' && !t.value && e.labs[i].techs.length){ e.labs[i].techs.pop(); renderTagbox(i, true); persistEntry(); }
  };
  main.addEventListener('focusout', onTagBlur, true);
}

  const course = existing || name;
  if(!existing) S.settings.courses.push(name);
  const e = st.entry;
  e.course = course; S.settings.lastCourse = course;
  $('[data-f="course"]').innerHTML = courseOptions(course);
  $('#addCourse').hidden = true;
  persistEntry(); saveNow();
  toast(existing ? `"${course}" was already on your list, so it's selected` : `"${course}" added to your course list`);

function dailyClick(ev){
  const t = ev.target, e = st.entry;

  if(dt){
    if(e.type !== dt.dataset.daytype){ e.type = dt.dataset.daytype; persistEntry(); renderToday(); }
    return;
  }
  const tab = t.closest('[data-daytab]');
  if(tab) return showDayTab(tab.dataset.daytab);
  if(t.closest('#tidyCopy') || t.closest('#tidyPreview')){
    // Build the prompt from the notes as they are right now; the global handler then copies or previews it.
    const has = !!clean(e.notes);
    st.prompts.tidy = has ? tidyPrompt(e) : '';
    $('#pre-tidy').textContent = has ? st.prompts.tidy : 'Write some class notes first, then come back here.';
    if(!has && t.closest('#tidyCopy')) toast('Write some class notes first');
    return;
  }
  const mg = t.closest('[data-missgo]');
  if(mg){ const m = (st.miss||[])[Number(mg.dataset.missgo)]; if(m) goToField(m); return; }
  if(t.id === 'saveCourse') return saveNewCourse();
  if(t.id === 'cancelCourse') return cancelNewCourse();
  const chip = t.closest('[data-chip]');
  if(chip){
    const l = e.labs[Number(chip.dataset.lab)], a = chip.dataset.chip;
    const k = l.actions.indexOf(a); if(k>=0) l.actions.splice(k,1); else l.actions.push(a);
    chip.classList.toggle('on', k<0); chip.setAttribute('aria-pressed', String(k<0));
    return persistEntry();
  }
  const rm = t.closest('[data-rmtag]');
  if(rm){ const [i,j] = rm.dataset.rmtag.split(':').map(Number); e.labs[i].techs.splice(j,1); renderTagbox(i, true); return persistEntry(); }
  if(t.closest('.tagbox') && t.classList.contains('tagbox')) return t.querySelector('input').focus();
  if(t.id === 'clearDay'){
    if(confirm(`Clear everything you entered for ${fmtLong(e.date)}? This can't be undone.`)){ delete S.days[e.date]; saveNow(); renderToday(); toast('Day cleared'); }
    return;
  }
  if(t.id === 'finishDay' || t.id === 'promptsAnyway'){
    // flush any half-typed technology
    $$('[data-taginput]', main).forEach(inp => { if(clean(inp.value)) addTags(Number(inp.dataset.taginput), inp.value, false); });
    $$('.invalid', main).forEach(x=>x.classList.remove('invalid'));
    const miss = missingFields(e);
    const box = $('#missing');
    if(miss.length && t.id === 'finishDay'){
      miss.forEach(m => { const el = main.querySelector(m.sel); if(el) el.classList.add('invalid'); });

/* ---------- Refresh (spaced review) ---------- */
// Picks logged days from before this week, spread across three age bands, so older
// material keeps coming back. The pick changes once a day, not on every click.
function refreshPick(days){
  const today = todayISO(), thisMon = mondayOf(today);
  const past = days.filter(d => d.date < thisMon);
  if(!past.length) return [];
  let seed = [...today].reduce((h,c)=>(h*31 + c.charCodeAt(0)) >>> 0, 7);
  const rnd = () => (seed = (seed*1103515245 + 12345) >>> 0) / 4294967296;
  const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const age = d => daysBetween(d.date, today);
  const bands = [past.filter(d=>age(d)<14), past.filter(d=>age(d)>=14 && age(d)<35), past.filter(d=>age(d)>=35)].map(shuffle);
  const picked = [];
  for(let round=0; round<2; round++) bands.forEach(b => { if(b[round]) picked.push(b[round]); });
  const rest = shuffle(past.filter(d => !picked.includes(d)));
  while(picked.length < 4 && rest.length) picked.push(rest.shift());
  return picked.sort((a,b) => a.date < b.date ? -1 : 1);
}

          <select id="studySel">${options.length ? options.map(([v,l])=>`<option value="${esc(v)}" ${v===st.studySel?'selected':''}>${esc(l)}</option>`).join('') : '<option>Nothing logged with a course yet</option>'}</select></label>`}
      </div>
      ${mode==='refresh' ? `<p class="small muted" style="margin:12px 0 0">Refresh mixes in days from earlier weeks, some recent and some from weeks ago, so older material doesn't fade. Recalling something again after a few days is what makes it stick. The mix changes each day; try it once or twice a week.${sel.length ? ` Today's mix: ${sel.map(d=>esc(fmtShort(d.date))).join(', ')}.` : ''}</p>` : ''}
    </section>
    ${sel.length ? promptCardsHTML(sel, label, wk, mode==='refresh' ? {refresh:true, only:['examiner']} : {}) : `<div class="card muted">${mode==='course' ? 'Choose a course on your daily logs to study by course.' : mode==='refresh' ? 'Refresh reviews material from earlier weeks. Come back once you have logged days from a week before this one.' : 'Nothing to show.'}</div>`}
    <section class="card small muted"><b>Tip:</b> use the Listener to understand a topic, and the Examiner to keep it. Once a week, choose <b>Refresh</b> to review earlier weeks before they fade. Getting ready for interviews? Try the interview stories in <b>Summaries &amp; bullets</b>.</section>
  </div>`;
  main.onclick = e => { const b = e.target.closest('[data-mode]'); if(b){ st.studyMode = b.dataset.mode; st.studySel=''; renderStudy(); } };
  const s = $('#studySel'); if(s) s.onchange = e => { st.studySel = e.target.value; renderStudy(); };
}

/* ---------- Timeline ---------- */
function renderTimeline(){
  const days = loggedDays();
  const today = todayISO(), curW = weekOf(today);
  const labs = days.reduce((n,d)=>n+labsOf(d).length, 0);
  const techCount = new Set(days.flatMap(d=>labsOf(d).flatMap(l=>l.techs.map(t=>t.toLowerCase())))).size;
  const start = mondayOf(S.settings.startDate);
  let classDaysSoFar = 0;
  for(let i=0;i<TOTAL_WEEKS*7;i++){ const d = addDays(start,i); if(d>today) break; if(Math.floor(i/7)+1===PRO_DEV_WEEK) continue; const k=dow(d); if(k>=1&&k<=4) classDaysSoFar++; }
  const pct = classDaysSoFar ? Math.min(100, Math.round(days.filter(d=>dow(d.date)>=1&&dow(d.date)<=4).length/classDaysSoFar*100)) : 0;
  const weekPct = curW ? Math.max(0, Math.min(100, Math.round(Math.min(curW,TOTAL_WEEKS)/TOTAL_WEEKS*100))) : 0;

  let weeksHTML = '';
  for(let w=1; w<=TOTAL_WEEKS; w++){
    const ws = weekStart(w);
    if(w === PRO_DEV_WEEK){
      weeksHTML += `<div class="week-prodev ${w===curW?'current':''}"><span class="week-title">Week ${w}<span>${fmtMD(ws)} to ${fmtMD(addDays(ws,4))}</span></span><span class="pill purple">Pro-Dev Week · not tracked</span></div>`;
      continue;
    }
    const wd = [0,1,2,3,4].map(k=>addDays(ws,k));
    const logged = wd.slice(0,4).filter(d=>hasContent(S.days[d])).length;
    const wlabs = wd.reduce((n,d)=>n+(S.days[d]?labsOf(S.days[d]).length:0),0);
    const future = ws > today;
    const wk = S.weeks[w]; const reviewed = wk && (clean(wk.wins)||clean(wk.unclear)||clean(wk.focus)||wk.confidence);
    const rows = wd.map((d,k)=>{
      if(k===4) return `<button class="dayrow" data-goto="${d}"><b>${esc(fmtShort(d))}</b><span class="c">Weekly review</span><span class="labs small muted">${wk&&wk.confidence?`Confidence ${wk.confidence}/5`:''}</span>${reviewed?'<span class="pill ok">Done</span>':'<span class="pill">Not yet</span>'}</button>`;
      const e = S.days[d];
      const status = !hasContent(e) ? (d>today?'<span class="pill">Upcoming</span>':'<span class="pill">Not logged</span>') : isComplete(e) ? '<span class="pill ok">Complete</span>' : '<span class="pill draft">Draft</span>';
      return `<button class="dayrow" data-goto="${d}"><b>${esc(fmtShort(d))}</b><span class="c">${esc(e&&hasContent(e)?dayLabelText(e):'')}</span><span class="labs small muted">${labsText(e?labsOf(e).length:0)}</span>${status}</button>`;
    }).join('');
    weeksHTML += `<details class="week ${w===curW?'current':''} ${future?'future':''}" ${w===curW || (curW>TOTAL_WEEKS && w===TOTAL_WEEKS) ? 'open':''}>
      <summary><span class="week-title">Week ${w}<span>${fmtMD(ws)} to ${fmtMD(addDays(ws,3))}</span></span>
        <span class="actions-row" style="gap:6px">${w===curW?'<span class="pill purple">This week</span>':''}<span class="pill">${logged}/4 days</span><span class="pill">${labsText(wlabs)}</span></span></summary>
      <div class="dayrows">${rows}</div></details>`;
  }
  main.innerHTML = `<div class="stack">
    <section class="tiles">
      <div class="tile"><div class="num">${curW<1?'–':Math.min(curW,TOTAL_WEEKS)}<span class="muted" style="font-size:1rem"> / ${TOTAL_WEEKS}</span></div><div class="lbl">Week of training</div><div class="progress"><div style="width:${weekPct}%"></div></div></div>
      <div class="tile"><div class="num">${days.length}</div><div class="lbl">Days logged · ${pct}% of class days so far</div><div class="progress"><div style="width:${pct}%"></div></div></div>
      <div class="tile"><div class="num">${labs}</div><div class="lbl">Labs logged</div></div>
      <div class="tile"><div class="num">${techCount}</div><div class="lbl">Technologies used</div></div>
    </section>
    ${weeksHTML}
  </div>`;
  main.onclick = e => { const g = e.target.closest('[data-goto]'); if(g){ st.cur = g.dataset.goto; setView('today'); } };
}

/* ---------- Summaries & bullets ---------- */
function renderSummaries(){
  const all = loggedDays();
  const weeks = [...new Set(all.map(d=>weekOf(d.date)))].filter(w=>w>0).sort((a,b)=>a-b);
  const courses = coursesIn(all);
  if(!st.sumWeek && weeks.length) st.sumWeek = String(weeks[weeks.length-1]);
  if(!st.sumCourse && courses.length) st.sumCourse = courses[0];
  if(!st.sumFrom && all.length){ st.sumFrom = all[0].date; st.sumTo = all[all.length-1].date; }

  let days = all, label = 'my training so far';
  if(st.sumRange==='week'){ const w = Number(st.sumWeek); days = all.filter(d=>weekOf(d.date)===w); label = `week ${w} of my training`; }
  if(st.sumRange==='course'){ days = all.filter(d=>d.course===st.sumCourse); label = `my ${st.sumCourse} course`; }
  if(st.sumRange==='range'){ days = all.filter(d=>d.date>=st.sumFrom && d.date<=st.sumTo); label = `${st.sumFrom ? fmtLong(st.sumFrom):''} to ${st.sumTo ? fmtLong(st.sumTo):''}`; }

  const types = [['bullets','Resume bullets',ICON.bullets,'c-teal'],['summary','Training summary',ICON.summary,'c-blue'],['star','Interview stories (STAR)',ICON.star,'c-purple']];
  let promptHTML = '';
  if(days.length){
    const text = summaryPrompt(st.sumType, days, label);
    const id = regPrompt(text);
    const long = text.length > 12000;
    promptHTML = `<section class="card">
      <div class="card-head"><h3>Your prompt</h3><span class="charcount ${long?'warn':''}">${text.length.toLocaleString()} characters${long?' · may be too long for some AI tools. Try a smaller range.':''}</span></div>
      <pre class="prompt" style="max-height:280px">${esc(text)}</pre>
      <div class="actions-row" style="margin-top:12px"><button class="btn primary" data-copy="${id}">Copy prompt</button><span class="muted small">Paste it into your AI tool. ${st.sumType==='bullets' ? 'Then save the bullets you like below.' : ''}</span></div>
    </section>`;
  }

  // At a glance
  const techMap = new Map(), actMap = new Map();
  days.forEach(d=>labsOf(d).forEach(l=>{ l.techs.forEach(t=>{ const k=t.toLowerCase(); const v=techMap.get(k)||{name:t,n:0}; v.n++; techMap.set(k,v); }); l.actions.forEach(a=>actMap.set(a,(actMap.get(a)||0)+1)); }));
  const topTech = [...techMap.values()].sort((a,b)=>b.n-a.n).slice(0,18);
  const nLabs = days.reduce((n,d)=>n+labsOf(d).length,0);

  main.innerHTML = `<div class="stack">
    <section class="card">
      <h2>Summaries &amp; resume bullets</h2>
      <p class="lede">The app pulls together everything you've logged and writes a prompt for your AI tool. Your AI tool does the writing; your notes keep it accurate.</p>
      ${all.length ? `
      <div class="controls" style="margin-top:14px">
        <div><span class="q small">What to include</span><div class="seg" role="group">${[['all','Everything'],['week','A week'],['course','A course'],['range','Date range']].map(([k,l])=>`<button data-range="${k}" aria-pressed="${st.sumRange===k}">${l}</button>`).join('')}</div></div>
        ${st.sumRange==='week' ? `<label class="field"><span class="q small">Week</span><select id="sumWeek">${weeks.map(w=>`<option value="${w}" ${String(w)===st.sumWeek?'selected':''}>Week ${w}</option>`).join('')}</select></label>` : ''}
        ${st.sumRange==='course' ? `<label class="field"><span class="q small">Course</span><select id="sumCourse">${courses.length?courses.map(c=>`<option ${c===st.sumCourse?'selected':''}>${esc(c)}</option>`).join(''):'<option>No courses chosen yet</option>'}</select></label>` : ''}
        ${st.sumRange==='range' ? `<label class="field" style="min-width:150px"><span class="q small">From</span><input type="date" id="sumFrom" value="${st.sumFrom}"></label><label class="field" style="min-width:150px"><span class="q small">To</span><input type="date" id="sumTo" value="${st.sumTo}"></label>` : ''}
      </div>
      <div style="margin-top:14px"><span class="q small">What do you want?</span>
        <div class="prompt-grid" style="grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px">${types.map(([k,l,ic,c])=>`<button class="pcard" data-type="${k}" aria-pressed="${st.sumType===k}" style="cursor:pointer;text-align:left;flex-direction:row;align-items:center;padding:12px;${st.sumType===k?'border-color:var(--teal);box-shadow:0 0 0 2px color-mix(in srgb,var(--teal) 30%,transparent)':''}"><span class="pcard-icon ${c}">${ic}</span><b>${l}</b></button>`).join('')}</div>
      </div>` : `<div class="notice info" style="margin-top:12px">Nothing logged yet. Once you log a few days, you can build summaries and bullets here.</div>`}
    </section>
    ${all.length ? (days.length ? `
    <section class="card">
      <div class="card-head"><h3>At a glance</h3><span class="muted small">${days.length} day${days.length===1?'':'s'} · ${labsText(nLabs)}</span></div>
      ${topTech.length ? `<div class="chips">${topTech.map(t=>`<span class="tag static">${esc(t.name)} · ${t.n}</span>`).join('')}</div>` : '<p class="muted small">No technologies recorded in this range yet.</p>'}
      ${actMap.size ? `<p class="muted small" style="margin:8px 0 0">${[...actMap.entries()].sort((a,b)=>b[1]-a[1]).map(([a,n])=>`${a} ×${n}`).join(' · ')}</p>` : ''}
    </section>
    ${promptHTML}` : `<div class="card muted">No entries in this range.</div>`) : ''}
    <section class="card">
      <div class="card-head"><h3>My resume bullets</h3>${S.bullets.length?`<button class="btn small" id="copyAll">Copy all</button>`:''}</div>
      <p class="lede small" style="margin-top:-6px">Paste the bullets you like from your AI tool here (one per line) so they stay with your training record.</p>
      <textarea id="newBullets" rows="3" style="margin-top:10px" placeholder="Configured Azure Virtual Networks and Network Security Groups to segment workloads and block unauthorized inbound traffic."></textarea>
      <div class="actions-row" style="margin-top:10px"><button class="btn primary small" id="addBullets">Save bullets</button></div>
      ${S.bullets.length ? `<ul class="bullet-list">${S.bullets.map((b,i)=>`<li><span class="t">${esc(b.text)}</span><button class="btn ghost small" data-cpb="${i}">Copy</button><button class="btn ghost small danger" data-rmb="${i}" aria-label="Delete bullet">Delete</button></li>`).join('')}</ul>` : ''}
    </section>
  </div>`;

  main.onclick = e => {
    const t = e.target;
    const r = t.closest('[data-range]'); if(r){ st.sumRange = r.dataset.range; return renderSummaries(); }
    const ty = t.closest('[data-type]'); if(ty){ st.sumType = ty.dataset.type; return renderSummaries(); }
    if(t.id === 'addBullets'){
      const lines = linesOf($('#newBullets').value);
      if(!lines.length) return;
      lines.forEach(x=>S.bullets.push({text:x, created:Date.now()})); saveNow(); renderSummaries();
      toast(`${lines.length} bullet${lines.length>1?'s':''} saved`); return;
    }
    if(t.id === 'copyAll'){ st.prompts.__all = S.bullets.map(b=>'• '+b.text).join('\n'); return copyText(st.prompts.__all); }
    const c = t.closest('[data-cpb]'); if(c) return copyText(S.bullets[Number(c.dataset.cpb)].text);
    const d = t.closest('[data-rmb]'); if(d){ if(confirm('Delete this bullet?')){ S.bullets.splice(Number(d.dataset.rmb),1); saveNow(); renderSummaries(); } }
  };
  main.onchange = e => {
    const t = e.target;
    if(t.id==='sumWeek') st.sumWeek = t.value;
    else if(t.id==='sumCourse') st.sumCourse = t.value;
    else if(t.id==='sumFrom') st.sumFrom = t.value;
    else if(t.id==='sumTo') st.sumTo = t.value;
    else return;
    renderSummaries();
  };
}

/* ---------- Settings ---------- */
function exportData(){
  saveNow();
  S.settings.lastBackup = Date.now();
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `from-labs-to-bullets-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  saveNow(); toast('Backup downloaded. Keep it somewhere safe, like OneDrive.');
  if(st.view==='settings') renderSettings();
  else if(st.view==='today'){ const n = main.querySelector('.notice [data-export]'); if(n) n.closest('.notice').remove(); }
}
function importFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch(e){ return toast("That file isn't a valid backup."); }
    if(!data || typeof data!=='object' || !data.days || !data.settings) return toast("That file isn't a From Labs to Bullets backup.");
    const n = Object.keys(data.days).length;
    if(loggedDays().length && !confirm(`Replace the diary on this laptop with the backup (${n} days)? Your current entries will be overwritten.`)) return;
    S = normalize(data); saveNow(); toast(`Backup restored: ${n} days`); setView(S.settings.startDate ? 'timeline' : 'today');
  };
  reader.readAsText(file);
}
function renderSettings(){
  const last = S.settings.lastBackup;
  main.innerHTML = `<div class="stack">
    <section class="card">
      <h2>Training setup</h2>
      <label class="field" style="margin-top:12px"><span class="q">Training start date</span>
        <span class="hint">Your first day of class. Week numbers are counted from here.</span>
        <input type="date" id="setStart" value="${S.settings.startDate}" style="max-width:220px"></label>
      <label class="field"><span class="q">Your IT experience</span>
        <span class="hint">Included in your study prompts so the AI's questions match your level.</span>
        <select id="setLevel" style="max-width:420px">${levelOptions(S.settings.level)}</select></label>
      <label class="field"><span class="q">Courses and modules</span>
        <span class="hint">One per line. These appear in the "Course or module" list on your daily log.</span>
        <textarea id="setCourses" rows="8">${esc(S.settings.courses.join('\n'))}</textarea></label>
      <div class="actions-row"><button class="btn primary" id="saveSettings">Save setup</button><button class="btn ghost small" id="resetCourses">Restore default course list</button></div>
    </section>
    <section class="card">
      <h2>Auto-save to a file</h2>
      ${FS_OK ? `<p class="lede">Saves your diary to a file on your computer every time you type, so clearing Edge's data never erases your work. Keep the file in your <b>OneDrive</b> folder and it's backed up online too.</p>
      <p class="small" id="fileStatus" style="margin:12px 0">${fileStatusHTML()}</p>
      <div class="actions-row">
        ${AS.state === 'off' ? '<button class="btn primary" data-fs="on">Turn on auto-save</button><button class="btn" data-fs="open">Open my diary file</button>' : ''}
        ${AS.state === 'paused' ? '<button class="btn primary" data-fs="resume">Resume auto-save</button>' : ''}
        ${AS.state === 'problem' ? '<button class="btn primary" data-fs="open">Find my file</button><button class="btn" data-fs="on">Save to a new file</button>' : ''}
        ${AS.state === 'on' ? '<button class="btn" data-fs="on">Save to a different file</button>' : ''}
        ${AS.state !== 'off' ? '<button class="btn ghost small" data-fs="off">Turn off auto-save</button>' : ''}
      </div>
      ${AS.state === 'off' ? `<p class="small muted" style="margin:12px 0 0"><b>New computer, or Edge's data was cleared?</b> Click <b>Open my diary file</b> and choose your file. Everything comes back, up to the last thing you typed.</p>` : ''}`
      : '<p class="lede">Auto-save needs Microsoft Edge or Google Chrome on a computer. In this browser, download a backup every Friday instead.</p>'}
    </section>
    <section class="card">
      <h2>Backup &amp; restore</h2>
      <p class="lede">${AS.state === 'on' ? 'Auto-save keeps your diary file up to date. You can still download an extra copy any time.' : 'Download a backup every Friday and keep it in OneDrive or another safe place. You can restore it on a new laptop too.'}</p>
      <p class="small muted">${last ? `Last backup: ${new Date(last).toLocaleString()}` : 'No backup downloaded yet.'}</p>
      <div class="actions-row">
        <button class="btn primary" data-export>Download backup</button>
        <label class="btn" style="cursor:pointer">Restore from file<input type="file" id="importS" accept="application/json,.json" hidden></label>
      </div>
      ${storageOK ? '' : '<div class="notice" style="margin-top:12px">This browser is blocking storage, so entries may not be saved between visits. Download a backup before you close the page.</div>'}
    </section>
    <section class="card">
      <h2>Start over</h2>
      <p class="lede">Permanently erase every entry, review, and saved bullet from this browser.</p>
      <div class="actions-row" style="margin-top:12px"><button class="btn danger" id="wipe">Erase all my data</button></div>
    </section>
  </div>`;
  main.onclick = e => {
    const t = e.target;
    if(t.closest('[data-export]')) return exportData();
    if(t.id === 'saveSettings'){
      const sd = $('#setStart').value;
      if(!isValidISO(sd)){ $('#setStart').classList.add('invalid'); return toast('Please choose a start date.'); }
      const cs = linesOf($('#setCourses').value);
      S.settings.startDate = sd; S.settings.level = $('#setLevel').value; S.settings.courses = cs.length ? cs : DEFAULT_COURSES.slice();
      saveNow(); updateBadge(); toast('Setup saved');
    }
    if(t.id === 'resetCourses'){ $('#setCourses').value = DEFAULT_COURSES.join('\n'); }
    if(t.id === 'wipe'){
      const fileNote = AS.handle ? ` Auto-save will be turned off, but your file (${AS.handle.name}) will not be deleted.` : '';
      if(confirm(`Erase ALL your diary entries, reviews, and bullets from this browser? This cannot be undone. (Tip: download a backup first.)${fileNote}`) && confirm('Are you sure? Everything will be deleted.')){
        // Turn off auto-save first, so the empty diary is never written over the file.
        turnOffAutoSave(true).then(() => { S = fresh(); saveNow(); st.cur = todayISO(); setView('today'); toast('All data erased'); });
      }
    }
  };
  $('#importS').onchange = e => importFile(e.target.files[0]);
}

/* ---------- Boot ---------- */
setView('today');
refreshFileUI(false);
initAutoSave().then(() => refreshFileUI(false));
})();
</script>
</body>
